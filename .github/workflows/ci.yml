name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The abi3 floor and a newer release, across the three platforms.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # vendored Falcon C sources
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync (build the cffi extension and install dev deps)
        run: uv sync

      - name: Run tests (roundtrip, determinism, tamper, surface, KATs)
        run: uv run pytest -q

  lint:
    name: ruff (format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      # --only-group skips building the cffi extension: ruff reads source, so
      # the submodule checkout and C toolchain are unnecessary here.
      - run: uv sync --only-group dev --no-install-project
      - run: uv run --no-project ruff format --check .
      - run: uv run --no-project ruff check .
      # Dependency audit straight off uv.lock (no sync needed). --locked also
      # fails if the lockfile is stale against pyproject.toml. Real-time
      # monitoring between pushes is Dependabot's job (.github/dependabot.yml);
      # if an unrelated advisory ever blocks a PR, `uv audit --ignore <ID>` is
      # the escape hatch.
      - run: uv audit --locked

  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run mypy

  # Smoke-build the abi3 wheel on one platform so packaging regressions surface
  # on PRs. The full matrix and publish live in release.yml.
  wheel-smoke:
    name: cibuildwheel smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and test the abi3 wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-smoke-linux
          path: ./wheelhouse/*.whl
